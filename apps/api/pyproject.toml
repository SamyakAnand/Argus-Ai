[project]
name = "nexus-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5",
  "langgraph>=0.2",
]

[tool.vercel]
entrypoint = "nexus_api.main:app"
